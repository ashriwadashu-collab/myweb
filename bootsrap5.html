<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beautiful Places in India</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <style>
        body {
            background-color: #eef5ee;
            font-family: Arial, sans-serif;
        }



        .carousel-item img {
            width: 100px;
            height:400px;
            object-fit: cover;
        }

        .carousel {
            border-radius: 10px;
            overflow: hidden;
        }

        .carousel-caption {
            background-color: rgba(0, 0, 0, 0.55);
            padding: 15px;
            border-radius: 5px;
        }
    </style>
<body>
    <div class="container mt-5">

        <h1 class=" text-success  fw-bold text-center mb-2">
            Beautiful Places in India
        </h1>

        <div class="row justify-content-center">

            <div class="col-md-10">

                <div id="placesCarousel" class="carousel slide shadow" data-bs-ride="carousel">
                    <div class="carousel-indicators">

                        <button type="button" data-bs-target="#placesCarousel" data-bs-slide-to="0" class="active">
                        </button>

                        <button type="button" data-bs-target="#placesCarousel" data-bs-slide-to="1">
                        </button>

                        <button type="button" data-bs-target="#placesCarousel" data-bs-slide-to="2">
                        </button>

                        <button type="button" data-bs-target="#placesCarousel" data-bs-slide-to="3">
                        </button>

                        <button type="button" data-bs-target="#placesCarousel" data-bs-slide-to="4">
                        </button>

                    </div>
                    <div class="carousel-inner">
                        <div class="carousel-item active">

                             <img src="images/ic1.jpg"
                                class="d-block w-100">

                            <div class="carousel-caption">

                                <h3 class=".text-white">html</h3>

                            </div>

                        </div>

                        <div class="carousel-item">

                           <img src="images/ic4.jpg"
                                class="d-block w-100">

                            <div class="carousel-caption">

                                <h3>jquery</h3>
                            </div>

                        </div>

                        <div class="carousel-item">

                           <img src="images/ic3.jpg"
                                class="d-block w-100">

                            <div class="carousel-caption">

                                <h3>css</h3>

                            </div>

                        </div>

                        <div class="carousel-item">

                           <img src="images/ic2.jpg"
                                class="d-block w-100">

                            <div class="carousel-caption">

                                <h3>JavaScript</h3>
                            </div>

                        </div>
                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#placesCarousel"
                        data-bs-slide="prev">

                        <span class="carousel-control-prev-icon"></span>

                        <span class="visually-hidden">
                            Previous
                        </span>

                    </button>

                    <button class="carousel-control-next" type="button" data-bs-target="#placesCarousel"
                        data-bs-slide="next">

                        <span class="carousel-control-next-icon"></span>

                        <span class="visually-hidden">
                            Next
                        </span>

                    </button>
                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>

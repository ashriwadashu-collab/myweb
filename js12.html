<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #box {
        margin: auto;
        background: gray;
        width: 800px;
    }

    .pic {
        width: 100px;
        height: 100px;
        margin: 1px;
        transition: 0.50s;
        cursor: pointer;
        position: relative;
    }

    #mask {
        background: 100px;
        width: 100%;
        height: 70%;
        background: black;
        box-shadow: 10px 10px 10px gray;
        margin: auto;
        overflow: hidden;
    }

    #slider {
        margin: 1px;
        width: 99%;
    }
</style>

<body>
    <div id="mask">

        <div id="box">
            <img src="images/web1.jpg" class="pic">
            <img src="images/web2.jpg" class="pic">
            <img src="images/web3.jpg" class="pic">
            <img src="images/web4.jpg" class="pic">
            <img src="images/web6.jpg" class="pic">
            <img src="images/web7.jpg" class="pic">
            <img src="images/web8.jpg" class="pic">

            </div>
            <input type = "range" min="0" max="600" id="slider" oninput="move()">
            </div>

            <input type="color" oninput="document.body.style.background=this.value">
            <script>
                function move() {
                    var slider = document.getElementById("slider");
                    var box = document.getElementById("box");
                    box.style.marginLeft = -slider.value + "px";
                }
            </script>

</body>

</html>

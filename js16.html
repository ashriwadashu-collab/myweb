<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        background: white;
        color: black;
        padding-top: 80px;
        /* Header ke niche space */
    }

    header {
        background: black;
        padding: 15px 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid #ddd;
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1000;
    }

    header h2 {
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    header h2:hover {
        color: rgb(232, 8, 49);
    }

    nav a {
        margin-left: 20px;
        text-decoration: none;
        color: white;
        font-size: 14px;
        font-weight: bold;
    }

    nav a:hover {
        color: #f56709;
    }

    /* Image Center */
    #pic {
        width: 30%;
        height: 500px;
        display: block;
        margin: 40px auto;
        box-shadow: 10px 10px 10px gray;
    }

    #pic img{
        width:100%;
        height:100%;
        overflow: hidden;
        object-fit: cover;
    }

    #m {
        text-align: center;
        margin-top: 20px;
        font-size: 35px;
    }
</style>
<header>
    <h2>HARI SHANKAR</h2>
    <nav>
        <a href="#">Home</a>
        <a href="acwh.html">Practice Work</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<body>

    <img id="pic">

    <h1 id="m"></h1>

    <script>

        var b = document.body;
        var d = new Date();
        var m = document.getElementById("m")
        var pic = document.getElementById("pic")
        //pic.src = "images/aotm2.jpg"
        var today = d.getDay()

        switch (today) {
            case 1:
                m.innerHTML += "monday"
                pic.src = "images/2d1.jpg"
                document.body.style.backgroundColor = "red";
                break;

            case 2:
                m.innerHTML += "tuesday"
                pic.src = "images/2d2.jpg"
                document.body.style.backgroundColor = "green";
                break;


            case 3:
                m.innerHTML += "wednesday"
                pic.src = "images/2d5.jpg"
                document.body.style.backgroundColor = "blue";
                break;

            case 4:
                m.innerHTML += "thursday"
                pic.src = "images/2d5.jpg"
                document.body.style.backgroundColor = "pink";
                break;

            case 5:
                m.innerHTML += "friday"
                pic.src = "images/2d6.jpg"
                document.body.style.backgroundColor = "yellow";
                break;

            case 6:
                m.innerHTML += "saturday"
                pic.src = "images/2d1.jpg"
                document.body.style.backgroundColor = "cyan";
                break;

            case 0:
                m.innerHTML += "sunday"
                pic.src = "images/2d8.jpg"
                document.body.style.backgroundColor = "brown";
                break;
        }


        document.title = "rwady"
    </script>
</body>

</html>

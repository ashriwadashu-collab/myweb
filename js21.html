<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+Double+Pica:ital@0;1&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>banner</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
    }

    body {
        background-color:beige;
    }

    .pic {
        width: 50%;
        height: 70%;
        position: absolute;
        left: 25%;
        transition: 2s;
        margin-top: 20px;
        border-radius: 20px;
    }

    h1 {
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-style: italic;
        text-align: center;
        padding: 10px;
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
        background-color: #E36A6A;
        color: white;
    }
</style>

<body>
    <h1> Froasting Banner</h1>
    <header>
        <div class="banner">
            <img src="images/2d1.jpg" class="pic">
            <img src="images/aotm1.jpg" class="pic">
            <img src="images/2d5.jpg" class="pic">
            <img src="images/2d6.jpg" class="pic">
        </div>
    </header>
    <script>
        var plist = document.getElementsByTagName("img")
        var p1 = plist[3]
        var p2 = plist[2]
        var p3 = plist[1]
        var p4 = plist[0]
        var c = -1
        function runbanner() {
            switch (c) {
                case 0:
                    p1.style.opacity = 0
                    break;
                case 1:
                    p2.style.opacity = 0
                    break;
                case 2:
                    p3.style.opacity = 0
                    break;
                case 3:

                    break;
                case 4:
                    p1.style.opacity = 1
                    p2.style.opacity = 1
                    p3.style.opacity = 1
                    p4.style.opacity = 1
                    break;
            }
            if (c <= plist.length) {
                c++
            }
            else {
                c = 0
            }
            setTimeout("runbanner()", 1000)
        }
        runbanner()
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ - Bootstrap Accordion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Frequently Asked Questions</h1>
        <div class="accordion" id="faqAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-success text-white"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#faq1">
                        What is Bootstrap?
                    </button>
                </h2>
                <div id="faq1"
                    class="accordion-collapse collapse show"
                    data-bs-parent="#faqAccordion">
                    <div class="accordion-body border-none">
                        Bootstrap is a popular CSS framework used to create
                        responsive and professional websites easily.
                    </div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed bg-danger text-white"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#faq2">
                        Is Bootstrap responsive?
                    </button>
                </h2>
                <div id="faq2"
                    class="accordion-collapse collapse"
                    data-bs-parent="#faqAccordion">
                    <div class="accordion-body">
                        Yes, Bootstrap provides responsive classes that help
                        websites work properly on mobile, tablet and desktop.
                    </div>
                </div>
            </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

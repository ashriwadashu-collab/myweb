<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .banner {
        width: 400px;
        height: 400px;
        margin: auto;
        overflow: hidden;
        position: relative;
    }

    .banner img {
        width: 100%;
        height: 100%;
    }

    .banner img.active {
        display: block;
    }

    .radios {
        text-align: center;
        margin-top: 10px;
    }
</style>
</head>
<body onload="show()">

    <div class="banner">
        <img src="images/2d1.jpg" id="p" class="active">
    </div>

    <div clas="radios">
        <input type="radio" name="slide" id="r1">
        <input type="radio" name="slide" id="r2">
        <input type="radio" name="slide" id="r3">
        <input type="radio" name="slide" id="r4">
    </div>

    <script>
        var p = document.getElementById("p");
        var s = document.getElementsByName("slide");
        var c = 0

        s[c].checked = true;

        var t ;

        function show()
        {
            if(c<=s.length-1){

                c++
            }
            else
            {
                c=1;
            }
            p.src="images/p"+c+".jpg";
            s[c-1].checked = true;

            document.title = c
            t = setTimeout("show()",1000);

            s[0].onclick = function(){
                clearTimeout(t);
                setTimeout("p.src='images/2d1.jpg'", 1000);
                c=1
                setTimeout("show()", 6000);
            }


              s[1].onclick = function(){
                clearTimeout(t);
                setTimeout("p.src='images/2d5.jpg'", 1000);
                c=2
                setTimeout("show()", 6000);
            }

              s[2].onclick = function(){
                clearTimeout(t);
                setTimeout("p.src='images/web3.jpg'", 1000);
                c=3
                setTimeout("show()", 6000);
            }

              s[3].onclick = function(){
                clearTimeout(t);
                setTimeout("p.src='images/web4.jpg'", 1000);
                c=4
                setTimeout("show()", 6000);
            }

        }
    </script>

</body>

</html>

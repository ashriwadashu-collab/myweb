     <script>

    var ntn = document.getElementById("ntn")

    ntn.onclick = function () {

      document.body.classList.toggle("dark")


      if (document.body.classList.contains("dark")) {
        ntn.innerHTML = "🌙"
      }
      else {
        ntn.innerHTML = "☀️"
      }

    }

  </script>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        background: #f5f5f5;
    }

    nav {
        display: flex;
        justify-content: space-between;
        padding: 20px 90px;
        background: rgb(240, 240, 129);
        border: 30px soild black;
        color: black;
        align-items: center;
        font-family: 'Poppins', sans-serif;
        text-transform: capitalize;
        font-weight: bolder;
        font-size: 22px;
        font-size: larger;
        margin-bottom: 50px;
    }

    .logo {
        color: black;
        font-size: 25px;
        cursor: pointer;
        text-transform: capitalize;
        font-family: 'Great Vibes', cursive;
        font-size: larger;
        font-weight: bolder;
    }

    .logo span {
        color: rgb(247, 29, 221);
    }

    .menu {
        display: flex;
        gap: 30px;
    }

    .menu a {
        text-decoration: none;
        color: black;
        font-size: 20px;
    }

    #btn {
        display: none;
        background: white;
        color: black;
        font-size: 20px;
        border: 3px solid red;
        border-radius: 50%;
        width: 35px;
        cursor: pointer;
        font-size: 20px;
    }


    #system {
        background: white;
        color: black;
        font-size: 20px;
        border: none;
        border: 3px solid red;
        border-radius: 50%;
        width: 35px;
        cursor: pointer;
    }

    #system {
        font-size: 22px;
    }



    .login-box {
        background: rgb(193, 227, 247);
        padding: 30px;
        border-radius: 15px;
        width: 450px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        margin: auto;
        margin-top: 50px;
    }

    .login-box h2 {
        margin-bottom: 5px;
        color: red;
        text-transform: capitalize;
        font-size: 20px;
    }

    .login-box h3 {
        font-size: 35px;
        margin-bottom: 20px;
        text-transform: capitalize;
        font-family: cursive;
    }

    .login-box input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
    }

    .login-box button {
        width: 50%;
        padding: 12px;
        border: none;
        background: darkblue;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 20px;
        text-align: center;
        justify-content: center;
        margin-left: 90px;
        text-transform: capitalize;
        font-size: 20px;
    }


    .login-box p {
        text-align: center;
        margin-top: 15px;
    }


</style>

<header>
    <nav>
        <div class="logo">harshankar</div>


        <div class="menu" id="list">

            <a href="newpage.html">home</a>
            <a href="acwh.html">practice work</a>
            <a href="#">about</a>
            <a href="#">contact</a>
        </div>

        <button id="system">☀︎</button>
    </nav>
</header>

<body>



    <div class="login-box">
        <h2>drop us a message</h2>
        <h3>we don't <br>ghost.</h3>

        <input type="name" placeholder="enter name">
        <input type="number" placeholder="enter number">
        <input type="email" placeholder="enter email">
        <input type="password" placeholder="Enter Password">

        <button>send it</button>

        <p>Don't have an account? Sign Up</p>
    </div>
    </div>
    </div>

       




</body>

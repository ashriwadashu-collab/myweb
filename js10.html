<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1{
        text-align: center;
        text-transform: capitalize;
        margin:auto;
    }
</style>

<body>
    <h1>random color generate</h1>
    <script>
        var t
        var r, g, b, c
        function show() {
            r = Math.round(Math.random() * 255)
            g = Math.round(Math.random() * 225)
            b = Math.round(Math.random() * 225)
            c = `rgb(${r},${g},${b})`
            document.body.style.background = c
            document.title = c
        }

        t = setInterval("show()", 1000)
        document.body.onclick = function () {
            clearInterval(t)
            alert("Set interval id sto now")
        }

        document.title = "no error"

    </script>

    
</body>

</html>

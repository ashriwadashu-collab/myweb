<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unkempt:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner</title>
</head>
<style>
    * {
        padding: 0%;
        margin: 0%;
        box-sizing: border-box;
    }

    header {
        text-align: center;
        font-size: 40px;
        background-color:red;
        color: black;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        margin-top: 5px;
        font-style: normal;
        color: white;
        padding: 8px;
    }

    body {
        background-color:beige;
    }

    .banner {
        width: 700px;
        height: 600px;
        margin: auto;
        overflow: hidden;
        border-radius: 20px
    }

    .banner img {
        width: 100%;
        height: 100%;
        border-radius: 20px;
        margin-top: 20px;
    }

    .banner img .active {
        display: block;
    }

    .radios {
        text-align: center;
        margin-top: 20px;
    }

    .end {
        font-family: "Unkempt", cursive;
        font-weight: 700;
        background-color: #E36A6A;
        text-align: center;
        padding: 1px;
        color: white;
    }
</style>

<body onload="show()">
    <header>
        Radio button banner
    </header>
    <div class="banner">
        <img src="images/aotm2.jpg" id="p" class="active">
    </div>
    <div class="radios">
        <input type="radio" name="slide" id="r1">
        <input type="radio" name="slide" id="r2">
        <input type="radio" name="slide" id="r3">
        <input type="radio" name="slide" id="r4">
    </div>
    <script>
        var p = document.getElementById("p");
        var s = document.getElementsByName("slide");
        var c = 0;
        s[c].checked = true;
        var t;
        function show() {
            if (c <= s.length - 1) {
                c++
            }
            else if (c = 5) {
                c = 1
            }
            p.src = "images/z" + c + ".jpg";

            s[c - 1].checked = true;
            t = setTimeout("show()", 1000)
        }
        s[0].addEventListener("click", () => {
            clearTimeout(t);
            setTimeout(p.src = 'images/2d1.jpg', 2000);
            c = 1
            setTimeout("show()", 3000);
        })

        s[1].addEventListener("click", () => {
            clearTimeout(t);
            setTimeout(p.src = 'images/2d5.jpg', 2000);
            c = 1
            setTimeout("show()", 3000);
        })
        s[2].addEventListener("click", () => {
            clearTimeout(t);
            setTimeout(p.src = 'images/2d6.jpg', 2000);
            c = 1
            setTimeout("show()", 3000);
        })
        s[3].addEventListener("click", () => {
            clearTimeout(t);
            setTimeout(p.src = 'images/aotm1.jpg', 2000);
            c = 1
            setTimeout("show()", 3000);
        })


    </script>
</body>

</html>

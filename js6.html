<style>
   * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
   }

   body {
      background: white;
      color: black;
   }



   header {
      background: black;
      padding: 15px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #ddd;
      margin-bottom: 50px;
   }

   header h2 {
      color: white;
      font-weight: BOLD;
      cursor: pointer;
   }

   header h2:hover {
      color: rgb(232, 8, 49);
   }

   nav a {
      margin-left: 20px;
      text-decoration: none;
      color: white;
      font-size: 14px;
      font-weight: BOLD;
      cursor: pointer
   }

   nav a:hover {
      color: #f56709;
   }

   h1 input {
      margin: auto;
      display: block;
      background:red;
      color: white;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid black;
   }

   h1 #t1,
   #t2,
   #r {
      margin: auto;
      display: block;
   }

   .btn-box {
      display: flex;
      justify-content: center;
      gap: 10px;
   }

   button {
      background: black;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 30px;
   }

   h1 {
      text-align: center;
      margin-bottom: 20px;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
   }
</style>

<body>
   <h1>

      No 1 <input type="number" id="t1" value="0"><br>
      No 2 <input type="number" id="t2" value="0"><br><br>
      Result<input type="number" id="r" value="0"><br><br>

      <div class="btn-box">
         <button onclick="f1()">+</button>
         <button onclick="f2()">-</button>
         <button onclick="f3()">*</button>
         <button onclick="f4()">/</button>
      </div>

      <script>
         var n1 = document.getElementById("t1")
         var n2 = document.getElementById("t2")
         var n = document.getElementById("r")

         function f1() {

            var calculate = parseInt(n1.value) + parseInt(n2.value)
            n.value = calculate
         }

         function f2() {

            var calculate = parseInt(n1.value) - parseInt(n2.value)
            n.value = calculate
         }

         function f3() {

            var calculate = parseInt(n1.value) * parseInt(n2.value)
            n.value = calculate
         }

         function f4() {

            var calculate = parseInt(n1.value) / parseInt(n2.value)
            n.value = calculate
         }
      </script>

</body>

</html>

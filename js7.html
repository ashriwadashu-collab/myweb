<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #clock
    {
        color:beige;
        font-size: 50px;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        background: purple;
        width:250px;
        padding:20px;
        text-align: center;
        box-shadow: 10px 10px 10px gray;
        margin: auto;
        display:block;
        margin-top: 100px;
        border-radius: 20px;
    }

 button{
     margin: auto;
        display:block;
        display:flex;
        padding:10px;
        background:black;
        color:white;
        border-radius: 15px;
        margin-top: 30px;
        justify-content: space-between;
 }
</style>
<body>
    <div id="clock">time</div>
    <button onclick="st()">Start Clock</button>
    <button onclick="sto()">Stop Clock</button>

   <script>
        function show()
        {
    var d = new Date()
    var t = document.getElementById("clock")
     t.innerHTML = d.toLocaleTimeString()

        }
     var timer 
        function st()  
        {
            timer = setInterval("show()",1000)
        }


        function sto()  
        {
           clearInterval(timer)
        }



        document.title="No Error"
    </script>
</body>
</html>

<style>

     * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    background: white;
    color: black;
  }


  .dark {
    background: red;
    color: white;
  }

  /* Button */

  #ntn {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    font-size: 30px;
    cursor: pointer;
    transition: 0.5s;
    background: none;
  }

  header {
    background:black;
    padding: 15px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #ddd;
    margin-bottom: 100px;
  }

  header h2 {
    color:white;
    font-weight: BOLD;
    cursor: pointer;
  }

  header h2:hover {
    color: rgb(232, 8, 49);
  }

  nav a {
    margin-left: 20px;
    text-decoration: none;
    color:white;
    font-size: 14px;
    font-weight: BOLD;
    cursor: pointer
  }

  nav a:hover {
    color: #f56709;
  }

    #nav{
        display:flex;
        justify-content: space-evenly;
    }

    #nav button{
        background:black;
        color:white;
        padding:10px;
        border:none;
        width:15vh;
        cursor:pointer;
        font-size: 15px;
        border-radius: 20px;
    }

    #m, #m2, #m3{
        width:80px;
        margin-top: 2px;
        background: lightgreen;
        color:black;
        padding:0px;
    }

    li{
        list-style-type: none;
        padding:10px;
        cursor:pointer;
    }

    li:hover{
        background:black;
        color:lightgreen;
    }
    .toggle{
        display:none;
    }
</style>
<body>
    <div id="nav">

<div>
<button onclick ="show_hide_menu(event)" id="menu1">main</button>
<ol id="m" class="toggle">
    <li>menu</li>
    <li>menu</li>
    <li>menu</li>
</ol>
</div>


<div>
<button onclick="show_hide_menu(event)" id="menu2">project</button>
<ol id="m2" class="toggle">
    <li>menu</li>
    <li>menu</li>
    <li>menu</li>
</ol>
</div>

<div>
<button onclick="show_hide_menu(event)" id="menu3">social media</button>
<ol id="m3" class="toggle">
    <li>menu</li>
    <li>menu</li>
    <li>menu</li>
</ol>
</div>
</div>

<script>
    var menu_visible = false;

    var m1 = document.getElementById("m");

    function show_hide_menu(event)
    {
        var mid = event.target.id
        
        m1.classList.add("toggle");
        m2.classList.add("toggle");
        m3.classList.add("toggle");

        switch(mid)
        {
            case "menu1":
                m1.classList.remove("toggle");
                document.title = "menu1"
                break;
                case "menu2":
                m2.classList.remove("toggle");
                document.title = "menu2"
                break;
                case "menu3":
                m3.classList.remove("toggle");
                document.title = "menu3"
                break;
        }
    }

    window.onclick = function(event)
    {
        if((event.target == "[object HTMLHtmlElement]")||(event.target == "[object HTMLUnknowElement]"))

        {
            m1.classList.add("toggle")
            m2.classList.add("toggle")
            m3.classList.add("toggle")
        }
    }
</script>

  <script>

    var ntn = document.getElementById("ntn")

    ntn.onclick = function () {

      document.body.classList.toggle("dark")


      if (document.body.classList.contains("dark")) {
        ntn.innerHTML = "🌙"
      }
      else {
        ntn.innerHTML = "☀️"
      }

    }

  </script>
</body>
